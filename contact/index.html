<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact | Pomodoro Timer</title>
  <meta name="description" content="Contact the Pomodoro Timer team with questions, feedback, or bug reports.">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191a1b" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://YOURDOMAIN.com/contact/">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script>
    try {
      var savedSettings = JSON.parse(localStorage.getItem('pomodoro.settings') || '{}');
      document.documentElement.dataset.theme = ['light', 'dark', 'system'].includes(savedSettings.theme)
        ? savedSettings.theme : 'system';
    } catch (error) { document.documentElement.dataset.theme = 'system'; }
  </script>
</head>
<body class="info-page">
  <header class="info-header">
    <a class="brand" href="/" aria-label="Pomodoro Timer home"><span aria-hidden="true">🍅</span> Pomodoro Timer</a>
    <a class="back-link" href="/">Back to timer</a>
  </header>
  <main>
    <article class="settings-view info-content">
      <h1 class="page-title">Contact</h1>
      <p>Questions, feedback or bug reports? Get in touch.</p>
      <!-- TODO: add contact email -->
      <p>Email: <span id="contact-email">[EMAIL TO BE ADDED]</span></p>
      <p>We aim to reply within a few days.</p>
    </article>
  </main>
  <footer class="site-footer">
    <nav aria-label="Footer">
      <a href="/privacy/">Privacy Policy</a><span aria-hidden="true">|</span>
      <a href="/about/">About</a><span aria-hidden="true">|</span>
      <a href="/contact/">Contact</a>
    </nav>
    <p>No accounts. Timer data stays in your browser.</p>
  </footer>
</body>
</html>
